name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use OIDC-capable npm
        run: npm install --global npm@^11.15.0

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release gates
        run: |
          node test/test-mcp-device-branding.js
          node test/test-canonical-release-cleanup.js
          node test/test-windows-local-storage.js
          node test/test-gateway-config.js

      - name: Publish with npm trusted publishing
        run: npm publish --access public
